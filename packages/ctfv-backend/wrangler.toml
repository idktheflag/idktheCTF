name = "ctfv-backend"
account_id = "947309b8559eadac8c20a351beedf8c6"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-10-30"
compatibility_flags = [ "nodejs_compat" ]

[[ratelimits]]
name = "AUTH_LOGIN_LIMITER"
namespace_id = "186431701"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "AUTH_RECOVERY_LIMITER"
namespace_id = "186431702"

  [ratelimits.simple]
  limit = 4
  period = 60

[[ratelimits]]
name = "AUTH_REGISTRATION_LIMITER"
namespace_id = "186431703"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "AUTH_IP_LIMITER"
namespace_id = "186431704"

  [ratelimits.simple]
  limit = 120
  period = 60

[[routes]]
pattern = "ctf.idktheflag.sh"
custom_domain = true

[assets]
directory = "../ctfv-frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[vars]
APP_URL = "https://ctf.idktheflag.sh"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "no-reply@idktheflag.sh" ]

[[r2_buckets]]
binding = "FILES"
bucket_name = "ctfv-challenge-files"

# [vars]
# MY_VAR = "my-variable"

# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

[[d1_databases]]
binding = "DATABASE"
database_name = "ctfV-db"
database_id = "4e2b0500-f765-43cc-b227-aff0e7370fd7"
migrations_dir = "drizzle"

# [ai]
# binding = "AI"

[observability]
enabled = true

[triggers]
crons = [ "*/5 * * * *" ]
